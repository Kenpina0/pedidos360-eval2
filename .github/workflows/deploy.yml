name: CI/CD · Build, Push a GHCR y Deploy en EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository_owner }}/pedidos360-backend
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1) Compila y prueba el backend Spring Boot
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar tests
        working-directory: backend
        run: mvn -B -ntp clean verify

      - name: Publicar el JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pedidos360-backend-jar
          path: backend/target/*.jar
          retention-days: 5

  # ---------------------------------------------------------------------------
  # 2) Construye la imagen Docker y la publica en GitHub Container Registry
  # ---------------------------------------------------------------------------
  docker-publish:
    name: Docker → GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3) Despliegue en la instancia EC2 por SSH (docker pull + docker run)
  # ---------------------------------------------------------------------------
  deploy-ec2:
    name: Deploy en EC2
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            docker stop pedidos360-backend || true
            docker rm pedidos360-backend || true

            docker run -d \
              --name pedidos360-backend \
              --restart unless-stopped \
              -p 80:8080 \
              -e SERVER_PORT=8080 \
              -e COGNITO_ISSUER_URI="${{ secrets.COGNITO_ISSUER_URI }}" \
              -e RABBITMQ_HOST="${{ secrets.RABBITMQ_HOST }}" \
              -e RABBITMQ_PORT=5672 \
              -e RABBITMQ_USER="${{ secrets.RABBITMQ_USER }}" \
              -e RABBITMQ_PASSWORD="${{ secrets.RABBITMQ_PASSWORD }}" \
              -e CORS_ALLOWED_ORIGINS="${{ secrets.CORS_ALLOWED_ORIGINS }}" \
              ghcr.io/${{ env.IMAGE_NAME }}:latest

            echo "Desplegado. Estado del contenedor:"
            docker ps --filter name=pedidos360-backend
