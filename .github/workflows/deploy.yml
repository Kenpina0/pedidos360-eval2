name: CI/CD · Build, Push a GHCR y Deploy en EC2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.repository_owner }}/pedidos360-backend
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # 1) Compila y prueba el backend Spring Boot
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar tests
        working-directory: backend
        run: mvn -B -ntp clean verify

      - name: Publicar el JAR como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pedidos360-backend-jar
          path: backend/target/*.jar
          retention-days: 5

  # ---------------------------------------------------------------------------
  # 2) Construye la imagen Docker y la publica en GitHub Container Registry
  # ---------------------------------------------------------------------------
  docker-publish:
    name: Docker → GHCR
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 3) Despliegue en la instancia EC2 por SSH (docker pull + docker run)
  # ---------------------------------------------------------------------------
  deploy-ec2:
    name: Deploy en EC2
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e

            # 1) Autenticarse contra GHCR (el PAT necesita read:packages)
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 2) Descargar la imagen recién publicada
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest

            # 3) Actualizar el proyecto docker compose que ya corre en la EC2
            cd ~/pedidos360/infra

            # Apunta el servicio `backend` a la imagen de GHCR (idempotente)
            if grep -q '^BACKEND_IMAGE=' .env; then
              sed -i "s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:latest|" .env
            else
              echo "BACKEND_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}:latest" >> .env
            fi

            # 4) Recrear solo el backend, sin tocar RabbitMQ ni el frontend
            docker compose up -d --no-deps backend

            echo "--- Desplegado. Estado del contenedor: ---"
            docker ps --filter name=pedidos360-backend

            echo "--- Health check ---"
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
                echo "Backend OK: $(curl -s http://localhost:8080/api/health)"
                exit 0
              fi
              sleep 3
            done
            echo "El backend no respondió al health check"
            docker logs --tail 50 pedidos360-backend
            exit 1
