# =============================================================================
# RabbitMQ · configuración común a los dos nodos del clúster
# =============================================================================
# El usuario/contraseña se inyectan por variables de entorno en docker-compose
# (RABBITMQ_DEFAULT_USER / RABBITMQ_DEFAULT_PASS). Aquí solo ajustes de nodo.

# Permite conexiones remotas con el usuario por defecto (no usar guest en prod)
loopback_users.guest = false

# Listener AMQP y consola de administración
listeners.tcp.default = 5672
management.tcp.port = 15672

# Importa automáticamente las definiciones (colas, exchanges, bindings, DLQ)
management.load_definitions = /etc/rabbitmq/definitions.json

# Heartbeat y límites razonables para demo
heartbeat = 60
channel_max = 2047
